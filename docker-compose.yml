services:
  go-service:
    build:
      context: ./go-service
      dockerfile: Dockerfile
    container_name: bitmap-go-service
    volumes:
      - ./corpus.db:/root/corpus.db:ro
    environment:
      - DUCKDB_PATH=/root/corpus.db
      - SERVER_PORT=${SERVER_PORT:-8080}
    restart: unless-stopped

  python-service:
    build:
      context: ./python-service
      dockerfile: Dockerfile
    container_name: cs-jp-lp-benchmark
    volumes:
      - ./benchmark-data:/app/data/bench_data
      - ${RESULTS_DIR:-./results}:/app/results
    environment:
      - PYTHONUNBUFFERED=1
      - SERVICE_URL=http://go-service:8080
