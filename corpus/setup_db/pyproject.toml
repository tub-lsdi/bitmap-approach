[project]
name = "corpus-setup"
version = "0.1.0"
description = "Database ingestion scripts for corpus data"
requires-python = ">=3.9"
dependencies = [
    "pyarrow>=17.0.0",
    "duckdb>=1.0.0",
    "loguru>=0.7.0",
    "tqdm>=4.66.0",
    "orjson>=3.10.0",
    "regex>=2024.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
